<body>
  <div class="app">
    <header><button class="home" id="home">Games</button><h1>Hunter's Shark Number Games</h1><button class="round" id="sound" aria-label="Hear the instruction">🔊</button></header>
    <main class="card">
      <section class="home-screen"><div class="intro"><div class="mascot">🦈</div><div><h2>Choose a shark game!</h2><p>Numbers 1–5</p></div></div><div class="menu" id="menu"></div></section>
      <section class="game-screen"><div class="game-head"><h2 id="title"></h2><p class="instruction" id="instruction"></p><div class="progress" id="progress"></div></div><div class="play" id="play"></div></section>
    </main>
  </div>
  <script>
    const words=['no','one','two','three','four','five'];
    const games=[
      ['same','4️⃣','Match Numbers','number to number'],['build','🦈','Build Sharks','number to quantity'],['count','👀','Count Sharks','quantity to number'],
      ['order','1️⃣','Shark Number Line','arrange 1–5'],['missing','❓','Missing Number','complete the line'],['before','⏭️','Before & After','what comes next?'],
      ['makefive','✋','Make Five','put groups together'],['sentence','💬','Shark Sentence','I see __ sharks'],['puzzle','🧩','Shark Puzzles','build in number order'],['paint','🎨','Paint the Shark','listen, choose, paint'],['trace','✍️','Trace Numbers','follow the dot']
    ];
    const level=Object.fromEntries(games.map(g=>[g[0],1]));let active=null,drag=null,wrongs=0,beforeMode='after',filled=new Set(),sentenceNumber=-1,sentenceTrial=1,sentenceDeck=[],puzzleRound=1,puzzleNext=1,paintRound=1,paintStep=0,paintTasks=[],selectedPaint=null,traceState={active:false,progress:0,total:0};
    const paintColors={blue:'#278bd1',yellow:'#ffd23f',green:'#35b779',red:'#ff6262',purple:'#9b73df'};
    const paths={1:'M76 82 L125 45 L125 252',2:'M52 82 C58 24 184 18 188 88 C191 137 85 178 54 248 L190 248',3:'M55 54 C151 14 195 66 145 128 C212 143 194 256 69 248',4:'M170 48 L58 181 L201 181 L166 181 L166 252',5:'M188 48 L75 48 L66 137 C104 111 190 119 190 190 C190 257 82 273 52 218'};
    const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),n=()=>level[active]||1;
    games.forEach(g=>{const b=document.createElement('button');b.className='menu-card';b.innerHTML=`<span class="menu-icon">${g[1]}</span><span class="menu-title">${g[2]}</span><span class="menu-sub">${g[3]}</span>`;b.onclick=()=>open(g[0]);$('menu').appendChild(b)});
    function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.86;u.pitch=1.04;u.lang='en-CA';speechSynthesis.speak(u)}
    function celebrate(){['⭐','✨','🌟','🦈','✨'].forEach((x,i)=>{const s=document.createElement('span');s.className='star';s.textContent=x;s.style.left='50%';s.style.top='55%';const a=Math.PI*2*i/5-Math.PI/2,d=Math.min(innerWidth,520)*.34;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)})}
    function header(title,instruction,progress=true){$('title').textContent=title;$('instruction').textContent=instruction;$('progress').innerHTML=progress?[1,2,3,4,5].map(i=>`<span class="dot ${i<n()?'done':i===n()?'current':''}"></span>`).join(''):''}
    function foot(){return '<div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="action" id="next" disabled>Next</button><button class="action secondary" id="nextGame">Next game</button></div>'}
    function bindFoot(render){$('next').onclick=()=>{if(active==='sentence'){if(sentenceTrial<3){sentenceTrial++;sentenceNumber=sentenceDeck[sentenceTrial-1]}else{startSentenceSet()}}else if(active==='puzzle'){puzzleRound=puzzleRound===3?1:puzzleRound+1}else if(active==='paint'){paintRound=paintRound===3?1:paintRound+1}else{level[active]=n()===5?1:n()+1}render();speak(instructionText())};$('nextGame').onclick=nextGame}
    function nextGame(){const i=games.findIndex(g=>g[0]===active);open(games[(i+1)%games.length][0])}
    function startSentenceSet(){sentenceDeck=shuffle([0,1,2,3,4,5]).slice(0,3);sentenceTrial=1;sentenceNumber=sentenceDeck[0]}
    function open(id){active=id;wrongs=0;if(id==='sentence')startSentenceSet();if(id==='puzzle')puzzleRound=1;if(id==='paint')paintRound=1;document.body.classList.add('playing');render();speak(instructionText())}
    function home(){document.body.classList.remove('playing');active=null;speak('Choose a shark game.')}
    function paintInstruction(){const task=paintTasks[paintStep];return task?`Choose ${task.color}. Paint number ${task.number}.`:'Great painting!'}
    function instructionText(){const x=n();return{same:`Match number ${x}.`,build:`Put ${x} shark${x===1?'':'s'} in the water.`,count:'Count the sharks. Choose the number.',order:'Put the numbers in order from one to five.',missing:'Find the missing number.',before:beforeMode==='after'?`What comes after ${Math.min(4,Math.max(1,x))}?`:`What comes before ${Math.min(5,Math.max(2,x))}?`,makefive:'Add sharks to make five.',sentence:'Build the sentence.',puzzle:`Find puzzle piece ${puzzleNext}.`,paint:paintInstruction(),trace:`Trace number ${x}. Hold the yellow dot and follow the path.`}[active]}
    function render(){wrongs=0;({same:renderSame,build:renderBuild,count:renderCount,order:renderOrder,missing:renderMissing,before:renderBefore,makefive:renderFive,sentence:renderSentence,puzzle:renderPuzzle,paint:renderPaint,trace:renderTrace})[active]()}
    const nums=(v=[1,2,3,4,5])=>v.map(x=>`<div class="number" tabindex="0" data-drag="number" data-value="${x}" aria-label="Number ${x}">${x}</div>`).join('');
    function bindDrag(){document.querySelectorAll('[data-drag]').forEach(e=>{e.onpointerdown=startDrag;e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();autoDrop(e)}}})}
    function startDrag(e){if(e.currentTarget.classList.contains('used'))return;e.preventDefault();const source=e.currentTarget,ghost=source.cloneNode(true),r=source.getBoundingClientRect();ghost.classList.add('drag-ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);source.style.opacity='.2';drag={source,ghost,payload:{type:source.dataset.drag,value:source.dataset.value,key:source.dataset.key}};moveGhost(e.clientX,e.clientY);window.addEventListener('pointermove',dragMove,{passive:false});window.addEventListener('pointerup',endDrag,{once:true});window.addEventListener('pointercancel',cancelDrag,{once:true})}
    function moveGhost(x,y){if(drag){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}}function dragMove(e){e.preventDefault();moveGhost(e.clientX,e.clientY)}function cleanup(){if(!drag)return;drag.ghost.remove();drag.source.style.opacity='';window.removeEventListener('pointermove',dragMove)}
    function endDrag(e){if(!drag)return;const d=drag;cleanup();drag=null;if(!drop(document.elementFromPoint(e.clientX,e.clientY),d.payload,d.source,e.clientX,e.clientY))wrong(d.source)}function cancelDrag(){if(!drag)return;cleanup();drag=null}
    function autoDrop(source){const p={type:source.dataset.drag,value:source.dataset.value,key:source.dataset.key};let t=active==='sentence'?document.querySelector(`.word-slot[data-key="${p.key}"]`):active==='order'?document.querySelector(`.slot[data-value="${p.value}"]`):active==='puzzle'?document.querySelector(`.puzzle-slot[data-value="${p.value}"]`):document.querySelector('[data-drop]');const r=t?.getBoundingClientRect();if(!t||!drop(t,p,source,r.left+r.width/2,r.top+r.height/2))wrong(source)}
    function wrong(el){wrongs++;el?.classList.add('shake');setTimeout(()=>el?.classList.remove('shake'),380);const c=active==='puzzle'?`Find piece ${puzzleNext}.`:wrongs===1?'Try again. Look carefully.':instructionText();$('feedback').textContent=c;speak(c)}
    function finish(message,spoken=message){$('feedback').textContent=message;$('next').disabled=false;celebrate();speak(spoken)}
    function drop(raw,p,source,x,y){
      if(!raw)return false;
      if(active==='same'){const z=raw.closest('[data-drop="same"]');if(!z||+p.value!==n())return false;z.textContent=p.value;z.classList.add('correct','pop');source.classList.add('used');finish(`Yes! ${p.value} matches ${p.value}.`);return true}
      if(active==='build'){const t=raw.closest('[data-drop="tank"]');if(!t||p.type!=='shark')return false;const c=t.querySelectorAll('.placed').length;if(c>=n())return false;placeShark(t,x,y);source.classList.add('used');speak(String(c+1));if(c+1===n())finish(`Great! ${n()} shark${n()===1?'':'s'}.`,`I see ${words[n()]} shark${n()===1?'':'s'}.`);return true}
      if(['count','missing','before'].includes(active)){const z=raw.closest('[data-drop]'),a=+z?.dataset.answer;if(!z||+p.value!==a)return false;z.textContent=p.value;z.classList.add('correct','pop');source.classList.add('used');finish(`Yes! The answer is ${a}.`);return true}
      if(active==='order'){const z=raw.closest('.slot');if(!z||+p.value!==+z.dataset.value||filled.has(p.value))return false;z.textContent=p.value;z.classList.add('correct','pop');source.classList.add('used');filled.add(p.value);speak(p.value);if(filled.size===5)finish('Wonderful! One, two, three, four, five.');return true}
      if(active==='makefive'){const f=raw.closest('[data-drop="five"]');if(!f||p.type!=='shark')return false;const e=[...f.querySelectorAll('.cell:empty')][0];if(!e)return false;e.textContent='🦈';e.classList.add('added','pop');source.classList.add('used');const total=f.querySelectorAll('.cell:not(:empty)').length;speak(String(total));if(total===5)finish(`${n()} and ${5-n()} make 5.`);return true}
      if(active==='sentence'){const z=raw.closest('.word-slot');if(!z||z.dataset.key!==p.key||filled.has(p.key))return false;z.innerHTML=source.innerHTML;z.classList.add('correct','pop');source.classList.add('used');filled.add(p.key);if(filled.size===4){const q=sentenceNumber,plural=q===1?'shark':'sharks',amount=q===0?'no':q,complete=`I see ${amount} ${plural}.`,praise=sentenceTrial===3?`${complete} Great work! You completed three sentences.`:complete;finish(praise,`I see ${words[q]} ${plural}. Now you say it. I see ${words[q]} ${plural}.${sentenceTrial===3?' Great work! You completed three sentences.':''}`)}return true}
      if(active==='puzzle'){const z=raw.closest('.puzzle-slot'),value=+p.value;if(!z||p.type!=='puzzle'||value!==puzzleNext||value!==+z.dataset.value)return false;source.classList.add('placed-piece','pop');source.removeAttribute('data-drag');source.removeAttribute('tabindex');z.appendChild(source);speak(String(value));puzzleNext++;if(puzzleNext===6){$('puzzleBoard').classList.add('complete');finish(`Wonderful! You built puzzle ${puzzleRound} in order.`)}else{$('feedback').textContent=`Now find piece ${puzzleNext}.`;speak(`Now find piece ${puzzleNext}.`)}return true}
      return false}
    function placeShark(t,x,y){const s=document.createElement('span'),r=t.getBoundingClientRect(),i=t.querySelectorAll('.placed').length;s.className='placed pop';s.textContent='🦈';s.style.left=Math.max(4,Math.min(82,(x-r.left)/r.width*100-7))+'%';s.style.top=Math.max(19,Math.min(68,(y-r.top)/r.height*100-9))+'%';if(!Number.isFinite(x)){s.style.left=20+i*14+'%';s.style.top=35+i%2*25+'%'}t.appendChild(s)}
    function renderSame(){header('Match the Number',`Drag ${n()} onto the same number.`);$('play').innerHTML=`<div class="big-number">${n()}</div><div class="target" data-drop="same">?</div><div class="choices">${nums(shuffle([1,2,3,4,5]))}</div>${foot()}`;bindDrag();bindFoot(renderSame)}
    function renderBuild(){header('Build the Shark Group',`Put ${n()} shark${n()===1?'':'s'} in the water.`);$('play').innerHTML=`<div class="big-number">${n()}</div><div class="tank" data-drop="tank"></div><div class="shark-tray">${[1,2,3,4,5].map(()=>'<div class="shark" tabindex="0" data-drag="shark">🦈</div>').join('')}</div>${foot()}`;bindDrag();bindFoot(renderBuild)}
    function renderCount(){header('Count the Sharks','Count the sharks. Drag the number.');$('play').innerHTML=`<div class="scene">${Array.from({length:n()},()=>'<span class="scene-shark">🦈</span>').join('')}</div><div class="target" data-drop="count" data-answer="${n()}">?</div><div class="choices">${nums(shuffle([1,2,3,4,5]))}</div>${foot()}`;bindDrag();bindFoot(renderCount)}
    function renderOrder(){header('Shark Number Line','Put the numbers in order from 1 to 5.',false);filled=new Set();$('play').innerHTML=`<div class="sequence">${[1,2,3,4,5].map(x=>`<div class="slot" data-value="${x}"></div>`).join('')}</div><div class="choices">${nums(shuffle([1,2,3,4,5]))}</div>${foot()}`;bindDrag();bindFoot(renderOrder)}
    function renderMissing(){header('Find the Missing Number','Drag the missing number into the line.');$('play').innerHTML=`<div class="sequence">${[1,2,3,4,5].map(x=>x===n()?`<div class="slot" data-drop="missing" data-answer="${x}">?</div>`:`<div class="slot fixed">${x}</div>`).join('')}</div><div class="choices">${nums(shuffle([1,2,3,4,5]))}</div>${foot()}`;bindDrag();bindFoot(renderMissing)}
    function renderBefore(){beforeMode=n()%2?'after':'before';const shown=beforeMode==='after'?Math.min(n(),4):Math.max(n(),2),answer=beforeMode==='after'?shown+1:shown-1;header('Before and After',`What comes ${beforeMode} ${shown}?`);const blank=`<div class="target" data-drop="before" data-answer="${answer}">?</div>`;$('play').innerHTML=`<div class="before-card">${beforeMode==='before'?blank+'<div class="arrow">←</div>':''}<div class="before-number">${shown}</div>${beforeMode==='after'?'<div class="arrow">→</div>'+blank:''}</div><div class="choices">${nums(shuffle([1,2,3,4,5]))}</div>${foot()}`;bindDrag();bindFoot(renderBefore)}
    function renderFive(){const first=Math.min(4,n()),add=5-first;header('Make Five',`There are ${first}. Add ${add} to make 5.`);$('play').innerHTML=`<div class="sum">${first} and ___ make 5</div><div class="five" data-drop="five">${[1,2,3,4,5].map((_,i)=>`<div class="cell ${i<first?'first':''}">${i<first?'🦈':''}</div>`).join('')}</div><div class="shark-tray">${Array.from({length:add},()=>'<div class="shark" tabindex="0" data-drag="shark">🦈</div>').join('')}</div>${foot()}`;bindDrag();bindFoot(renderFive)}
    function renderSentence(){const q=sentenceNumber,plural=q===1?'shark':'sharks',amount=q===0?'no':q,amountPic=q===0?'🚫':q,parts=[['i','👦','I'],['see','👀','see'],['number',amountPic,amount],['sharks','🦈',plural]];header('Build the Shark Sentence',`Sentence ${sentenceTrial} of 3 — drag each picture-word into its matching space.`,false);$('progress').innerHTML=[1,2,3].map(i=>`<span class="dot ${i<sentenceTrial?'done':i===sentenceTrial?'current':''}"></span>`).join('');filled=new Set();const picture=q===0?'<span class="scene-shark" aria-label="No sharks">🌊</span>':Array.from({length:q},()=>'<span class="scene-shark">🦈</span>').join('');$('play').innerHTML=`<div class="sentence"><div class="picture">${picture}</div><div class="sentence-frame">${parts.map(p=>`<div class="word-slot" data-key="${p[0]}"><span class="pic">${p[1]}</span><span>${p[2]}</span></div>`).join('')}</div></div><div class="choices">${shuffle(parts).map(p=>`<div class="word" tabindex="0" data-drag="word" data-key="${p[0]}"><span class="pic">${p[1]}</span><span>${p[2]}</span></div>`).join('')}</div>${foot()}`;bindDrag();bindFoot(renderSentence);$('next').textContent=sentenceTrial===3?'Three more sentences':'Next sentence'}
    function puzzleArt(round,index,square=false){const position=square?`--col:${index%3};--row:${Math.floor(index/3)}`:`--piece:${index}`;return `<div class="puzzle-art ${square?'square-art ':''}r${round}" style="${position}"><span class="main-shark">🦈</span><span class="fish-one">🐟</span><span class="fish-two">🐠</span><span class="plant">🪸</span></div>`}
    function renderPuzzle(){puzzleNext=1;header('Build the Shark Puzzle',`Puzzle ${puzzleRound} of 3 — start with piece 1.`,false);$('progress').innerHTML=[1,2,3].map(i=>`<span class="dot ${i<puzzleRound?'done':i===puzzleRound?'current':''}"></span>`).join('');const movable=[0,2,4,6,8],anchors=[1,3,5,7],turns=[-7,5,-4,8,-6];const pieces=movable.map((cell,i)=>`<div class="puzzle-piece" style="--turn:${turns[i]}deg" tabindex="0" data-drag="puzzle" data-value="${i+1}">${puzzleArt(puzzleRound,cell,true)}<b>${i+1}</b></div>`);const board=Array.from({length:9},(_,cell)=>{const moveIndex=movable.indexOf(cell);return moveIndex>=0?`<div class="puzzle-slot" data-value="${moveIndex+1}"></div>`:`<div class="puzzle-anchor">${puzzleArt(puzzleRound,cell,true)}</div>`}).join('');$('play').innerHTML=`<div class="puzzle-board" id="puzzleBoard">${board}</div><div class="puzzle-tray">${shuffle(pieces).join('')}</div>${foot()}`;bindDrag();bindFoot(renderPuzzle);$('next').textContent=puzzleRound===3?'Play puzzles again':'Next puzzle'}
    function updatePaintPrompt(announce=true){const task=paintTasks[paintStep];if(!task)return;$('instruction').textContent=`Choose ${task.color}. Paint number ${task.number}.`;$('feedback').textContent=selectedPaint?`Now touch number ${task.number}.`:'';document.querySelectorAll('.paint-color').forEach(button=>button.classList.toggle('selected',button.dataset.color===selectedPaint));if(announce)speak(selectedPaint?`Now touch number ${task.number}.`:paintInstruction())}
    function choosePaint(event){const color=event.currentTarget.dataset.color,task=paintTasks[paintStep];if(!task)return;if(color!==task.color){event.currentTarget.classList.add('shake');setTimeout(()=>event.currentTarget.classList.remove('shake'),380);$('feedback').textContent=`Find ${task.color}.`;speak(`Try again. Find ${task.color}.`);return}selectedPaint=color;updatePaintPrompt(true)}
    function paintArea(event){const area=event.currentTarget,task=paintTasks[paintStep];if(!task)return;if(!selectedPaint){$('feedback').textContent=`Choose ${task.color} first.`;speak(`Choose ${task.color} first.`);return}if(+area.dataset.number!==task.number){area.classList.add('shake');setTimeout(()=>area.classList.remove('shake'),380);$('feedback').textContent=`Find number ${task.number}.`;speak(`Try again. Find number ${task.number}.`);return}area.style.setProperty('--paint',paintColors[task.color]);area.classList.add('painted','pop');speak(`${task.color}. Number ${task.number}.`);paintStep++;selectedPaint=null;if(paintStep===5){finish(`Beautiful! You painted shark picture ${paintRound}.`)}else{setTimeout(()=>updatePaintPrompt(true),500)}}
    function renderPaint(){paintStep=0;selectedPaint=null;paintTasks=shuffle([['blue',1],['yellow',2],['green',3],['red',4],['purple',5]]).map(([color,number])=>({color,number}));header('Paint the Shark Picture',`Picture ${paintRound} of 3 — listen for the colour and number.`,false);$('progress').innerHTML=[1,2,3].map(i=>`<span class="dot ${i<paintRound?'done':i===paintRound?'current':''}"></span>`).join('');$('play').innerHTML=`<div class="paint-board">${[1,2,3,4,5].map((number,index)=>`<button class="paint-area" data-number="${number}" aria-label="Paint area ${number}">${puzzleArt(paintRound,index)}<span class="area-number">${number}</span></button>`).join('')}</div><div class="palette">${Object.entries(paintColors).map(([name,color])=>`<button class="paint-color" data-color="${name}" style="background:${color}" aria-label="${name} paint"></button>`).join('')}</div>${foot()}`;document.querySelectorAll('.paint-color').forEach(button=>button.addEventListener('click',choosePaint));document.querySelectorAll('.paint-area').forEach(area=>area.addEventListener('click',paintArea));bindFoot(renderPaint);$('next').textContent=paintRound===3?'Paint again':'Next picture';updatePaintPrompt(false)}
    function renderTrace(){header('Trace the Number',`Trace ${n()}. Hold the yellow dot and follow the path.`);$('play').innerHTML=`<div class="trace-shell"><svg id="traceSvg" viewBox="0 0 240 300" aria-label="Trace number ${n()}"><path id="guide" class="guide" d="${paths[n()]}"></path><path id="traceProgress" class="trace-progress" d="${paths[n()]}"></path><circle id="traceStart" class="start" r="11"></circle><circle id="knob" class="knob" r="20"></circle></svg></div>${foot()}`;const g=$('guide'),p=$('traceProgress');requestAnimationFrame(()=>{const total=g.getTotalLength();traceState={active:false,progress:0,total};p.style.strokeDasharray=total;p.style.strokeDashoffset=total;const start=g.getPointAtLength(0);setCircle($('traceStart'),start);setCircle($('knob'),start)});$('knob').onpointerdown=startTrace;$('traceSvg').addEventListener('pointermove',moveTrace,{passive:false});$('traceSvg').onpointerup=()=>traceState.active=false;$('traceSvg').onpointercancel=()=>traceState.active=false;bindFoot(renderTrace)}
    function setCircle(c,p){c.setAttribute('cx',p.x);c.setAttribute('cy',p.y)}function svgPoint(e){const s=$('traceSvg'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())}function startTrace(e){e.preventDefault();traceState.active=true;e.currentTarget.setPointerCapture?.(e.pointerId)}
    function moveTrace(e){if(!traceState.active)return;e.preventDefault();const point=svgPoint(e),g=$('guide');let best={len:traceState.progress,dist:Infinity};for(let l=Math.max(0,traceState.progress-4);l<=Math.min(traceState.total,traceState.progress+Math.max(38,traceState.total*.1));l+=2){const p=g.getPointAtLength(l),d=Math.hypot(p.x-point.x,p.y-point.y);if(d<best.dist)best={len:l,dist:d}}if(best.dist>38)return;traceState.progress=Math.max(traceState.progress,best.len);setCircle($('knob'),g.getPointAtLength(traceState.progress));$('traceProgress').style.strokeDashoffset=traceState.total-traceState.progress;if(traceState.progress>=traceState.total*.965){traceState.active=false;$('traceProgress').style.strokeDashoffset=0;finish(`Great work! You traced number ${n()}.`)}}
    $('home').onclick=home;$('sound').onclick=()=>speak(active?instructionText():'Choose a shark game.');
    function registerWebMcp(){const c=document.modelContext;if(!c?.registerTool)return;const signal=new AbortController().signal;c.registerTool({name:'open_shark_number_game',title:'Open shark number game',description:'Open a shark number game for numbers 1 to 5.',inputSchema:{type:'object',properties:{game:{type:'string',enum:games.map(g=>g[0])}},required:['game'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(i){open(i.game);return{game:i.game,number:n()}}},{signal});c.registerTool({name:'set_practice_number',title:'Set practice number',description:'Set the current game to a number from 1 to 5.',inputSchema:{type:'object',properties:{number:{type:'integer',minimum:1,maximum:5}},required:['number'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(i){if(!active)open('same');level[active]=i.number;render();return{game:active,number:i.number}}},{signal})}registerWebMcp();
